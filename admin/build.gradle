plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.example.dacs3'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    
    // Firebase Admin SDK
    implementation 'com.google.firebase:firebase-admin:9.2.0'

    // Cloudinary
    implementation 'com.cloudinary:cloudinary-http44:1.36.0'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// Đọc local.properties từ root project
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

// Truyền thuộc tính vào bootRun để Spring @Value có thể đọc được
bootRun {
    systemProperty "pixazo.api.key", localProperties.getProperty("pixazo.api.key")
}

// Cũng truyền vào test nếu cần
test {
    useJUnitPlatform()
    systemProperty "pixazo.api.key", localProperties.getProperty("pixazo.api.key")
}

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hỗ trợ trực tuyến | WIND Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
    <style>
        body { background-color: #0f172a; color: #f1f5f9; }
        .main { padding: 25px; height: 100vh; display: flex; flex-direction: column;}

        .chat-container {
            flex: 1;
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .user-list {
            width: 320px;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            background: #1e293b;
        }

        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f172a;
        }

        .user-item {
            padding: 15px 20px;
            border-bottom: 1px solid #334155;
            cursor: pointer;
            transition: all 0.2s;
            color: #94a3b8;
        }

        .user-item:hover { background: #334155; color: #f1f5f9; }

        .user-item.active {
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid #3b82f6;
            color: #fff;
        }

        .message-area {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0f172a;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
        }

        .msg-user {
            align-self: flex-start;
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            border-bottom-left-radius: 2px;
        }

        .msg-admin {
            align-self: flex-end;
            background: #3b82f6;
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .msg-time {
            display: block;
            font-size: 0.65rem;
            margin-top: 4px;
            opacity: 0.6;
            text-align: right;
        }

        .msg-user .msg-time {
            text-align: left;
        }

        .chat-header {
            padding: 15px 25px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
        }

        .chat-input {
            padding: 20px;
            background: #1e293b;
            border-top: 1px solid #334155;
        }

        .chat-input input {
            background: #0f172a !important;
            border: 1px solid #334155 !important;
            color: #f1f5f9 !important;
            border-radius: 10px;
            padding: 10px 15px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('support_chat')}"></div>

    <div class="main">
        <header class="header mb-4">
            <h1 class="h4 mb-0">Hỗ trợ trực tuyến</h1>
            <div class="user-info">
                <span class="text-white me-3">Hôm nay: <strong th:text="${#calendars.format(#calendars.createNow(), 'dd/MM/yyyy')}"></strong></span>
                Xin chào <a href="/admin/profile" class="text-white text-decoration-none"><strong th:text="${session.adminUser != null ? session.adminUser['name'] : 'Admin'}">Admin</strong></a>
            </div>
        </header>

        <div class="chat-container">
            <!-- Danh sách User -->
            <div class="user-list">
                <div class="p-3 border-bottom border-secondary border-opacity-25">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-transparent border-secondary border-opacity-25 text-muted"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control bg-transparent border-secondary border-opacity-25 text-white" placeholder="Tìm khách hàng...">
                    </div>
                </div>
                <div class="overflow-auto flex-grow-1">
                    <div th:each="user : ${chatUsers}"
                         th:data-url="@{/admin/support(userId=${user.id})}"
                         onclick="window.location.href=this.getAttribute('data-url')"
                         class="user-item d-flex align-items-center"
                         th:classappend="${selectedUserId == user.id ? 'active' : ''}">
                        <div class="user-avatar me-3" th:text="${#strings.substring(user.name,0,1)}">U</div>
                        <div class="flex-grow-1 overflow-hidden">
                            <div class="d-flex justify-content-between align-items-center">
                                <strong class="text-truncate" th:text="${user.name}" style="max-width: 120px;">User Name</strong>
                                <small th:if="${user.lastTime != null}" class="text-white" style="font-size: 0.65rem"
                                       th:text="${#dates.format(user.lastTime.toDate(), 'HH:mm')}"></small>
                            </div>
                            <div class=" text-white text-truncate small" th:text="${user.lastMessage}">Last message preview...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cửa sổ Chat -->
            <div class="chat-window">
                <th:block th:if="${selectedUserId != null}">
                    <div class="chat-header">
                        <div class="user-avatar me-3" th:text="${#strings.substring(selectedUser.name,0,1)}">S</div>
                        <div>
                            <h6 class="mb-0 fw-bold text-white" th:text="${selectedUser.name}">Selected User</h6>
                            <small class="text-success" style="font-size: 0.7rem"><i class="bi bi-circle-fill me-1" style="font-size: 0.4rem"></i> Đang trực tuyến</small>
                        </div>
                    </div>

                    <div class="message-area" id="messageArea">
                        <div th:each="msg : ${messages}" class="message"
                             th:classappend="${msg.senderRole == 'admin' ? 'msg-admin' : 'msg-user'}">
                            <div th:text="${msg.text}">Message text content</div>
                            <small class="msg-time" th:if="${msg.timestamp != null}"
                                   th:text="${#dates.format(msg.timestamp.toDate(), 'HH:mm')}"></small>
                        </div>
                    </div>

                    <div class="chat-input">
                        <form id="chatForm" class="d-flex gap-2">
                            <input type="hidden" id="targetUserId" th:value="${selectedUserId}">
                            <input type="text" id="messageInput" class="form-control"
                                   placeholder="Nhập tin nhắn trả lời khách hàng..." autocomplete="off">
                            <button type="submit" class="btn btn-primary px-4 rounded-3">
                                <i class="bi bi-send-fill"></i>
                            </button>
                        </form>
                    </div>
                </th:block>

                <th:block th:unless="${selectedUserId != null}">
                    <div class="h-100 d-flex flex-column align-items-center justify-content-center text-white opacity-50">
                        <i class="bi bi-chat-dots" style="font-size: 5rem"></i>
                        <p class="mt-3 fw-bold">Chọn khách hàng để bắt đầu hỗ trợ</p>
                    </div>
                </th:block>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            var messageArea = $('#messageArea');
            if (messageArea.length) {
                messageArea.scrollTop(messageArea[0].scrollHeight);
            }

            // Real-time Update: Polling mỗi 3 giây để mượt hơn
            var userId = $('#targetUserId').val();
            if (userId) {
                setInterval(function() {
                    $.get(window.location.href, function(data) {
                        var newContent = $(data).find('#messageArea').html();
                        if (newContent && newContent.trim() !== messageArea.html().trim()) {
                            messageArea.html(newContent);
                            messageArea.scrollTop(messageArea[0].scrollHeight);
                        }
                    });
                }, 3000);
            }

            $('#chatForm').on('submit', function(e) {
                e.preventDefault();
                var userId = $('#targetUserId').val();
                var text = $('#messageInput').val();

                if (!text.trim()) return;

                // Optimistic UI
                var now = new Date();
                var timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                var tempMsg = '<div class="message msg-admin">' +
                                '<div>' + text + '</div>' +
                                '<small class="msg-time">' + timeStr + '</small>' +
                              '</div>';
                messageArea.append(tempMsg);
                messageArea.scrollTop(messageArea[0].scrollHeight);
                $('#messageInput').val('');

                $.post('/admin/support/send', {
                    userId: userId,
                    text: text
                }, function(res) {
                    if (!res.success) {
                        alert('Lỗi: ' + res.message);
                        location.reload();
                    }
                });
            });
        });
    </script>
</body>
</html>

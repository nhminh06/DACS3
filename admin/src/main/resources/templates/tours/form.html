<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${tourId == null ? 'Thêm Tour mới' : 'Chỉnh sửa Tour'} + ' - WIND Admin'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
    <style>
        body { background-color: #0f172a; color: #f1f5f9; }
        .form-container { background: #1e293b; padding: 30px; border-radius: 12px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.05); }
        .section-title { font-size: 18px; font-weight: 600; margin: 25px 0 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); color: #3b82f6; display: flex; align-items: center; }
        .form-label { color: #94a3b8; font-weight: 500; font-size: 13px; }
        .form-control, .form-select { background: #0f172a; border: 1px solid #334155; color: #f1f5f9; }
        .form-control:focus, .form-select:focus { background: #0f172a; border-color: #3b82f6; color: #f1f5f9; box-shadow: none; }
        .preview-img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid #334155; margin-top: 10px; }
        .offer-box { background: rgba(245, 158, 11, 0.05); border: 1px dashed #f59e0b; padding: 20px; border-radius: 12px; margin-top: 15px; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar('tours')}"></div>

    <div class="main">
        <header class="header">
            <h1 class="h4 mb-0" th:text="${tourId == null ? 'Thêm Tour mới' : 'Chỉnh sửa Tour'}">Thêm Tour mới</h1>
            <div class="user-info">
                <a href="/admin/tours" class="btn btn-sm btn-outline-light">Hủy & Quay lại</a>
            </div>
        </header>

        <div class="form-container">
            <form id="tourForm" th:action="@{/admin/tours/save}" method="POST" enctype="multipart/form-data">
                <input type="hidden" name="id" th:value="${tourId}">

                <div class="section-title"><i class="bi bi-info-circle-fill me-2"></i> Thông tin cơ bản</div>
                <div class="row mb-4">
                    <div class="col-md-3">
                        <label class="form-label">Mã Tour</label>
                        <input type="text" class="form-control" name="maTour" th:value="${tour != null ? tour.get('maTour') : ''}" required>
                    </div>
                    <div class="col-md-9">
                        <label class="form-label">Tên Tour</label>
                        <input type="text" class="form-control" name="tenTour" th:value="${tour != null ? tour.get('title') : ''}" required>
                    </div>
                </div>

                <div class="section-title"><i class="bi bi-tags-fill me-2"></i> Ưu đãi & Giảm giá</div>
                <div class="offer-box mb-4">
                    <div class="form-check form-switch mb-3">
                        <!-- Kiểm tra an toàn cho cả Boolean và String từ database -->
                        <input class="form-check-input" type="checkbox" name="isOffer" id="isOffer"
                               th:checked="${tour != null && #strings.toString(tour.get('isOffer')) == 'true'}"
                               onchange="toggleOffer()">
                        <label class="form-check-label fw-bold text-warning" for="isOffer">Thiết lập là Tour Ưu đãi (Giảm giá)</label>
                    </div>

                    <div id="offerSection" th:style="${tour != null && #strings.toString(tour.get('isOffer')) == 'true' ? 'display:block;' : 'display:none;'}">
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label text-warning">Giá gốc NL (Sẽ gạch ngang)</label>
                                <input type="number" class="form-control border-warning" id="origNL" name="originalPrice"
                                       th:value="${tour != null && tour.get('originalPrice') != null ? tour.get('originalPrice') : 0}"
                                       oninput="autoCalculate()">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-warning">Giá gốc Trẻ em</label>
                                <input type="number" class="form-control border-warning" id="origTE" name="originalPriceChild"
                                       th:value="${tour != null && tour.get('originalPriceChild') != null ? tour.get('originalPriceChild') : 0}"
                                       oninput="autoCalculate()">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-warning">Giá gốc Trẻ nhỏ</label>
                                <input type="number" class="form-control border-warning" id="origTN" name="originalPriceInfant"
                                       th:value="${tour != null && tour.get('originalPriceInfant') != null ? tour.get('originalPriceInfant') : 0}"
                                       oninput="autoCalculate()">
                            </div>
                        </div>
                        <div class="row mb-3 align-items-end">
                            <div class="col-md-3">
                                <label class="form-label">Nhập % Giảm giá (Vd: 20)</label>
                                <input type="number" class="form-control" id="discountPercent"
                                       th:value="${tour != null && tour.get('discountTag') != null ? #strings.toString(tour.get('discountTag')).replaceAll('[^0-9]', '') : 20}"
                                       oninput="autoCalculate()">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Nhãn hiển thị</label>
                                <input type="text" class="form-control" id="discountTag" name="discountTag" th:value="${tour != null ? tour.get('discountTag') : ''}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Hình nền Ưu đãi riêng</label>
                                <input type="file" class="form-control" name="offerImageFile" onchange="previewOffer(this)">
                                <input type="hidden" name="offerImageUrl" th:value="${tour != null ? tour.get('offerImageUrl') : ''}">
                                <div id="offerPreview">
                                    <img th:if="${tour != null && tour.get('offerImageUrl') != null && tour.get('offerImageUrl') != ''}" th:src="${tour.get('offerImageUrl')}" class="preview-img">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4">
                                <label class="form-label">Thời gian còn lại (HH:mm:ss)</label>
                                <label class="form-label">Thời gian ưu đãi còn lại</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="offerHours"
                                           placeholder="Giờ" min="0" style="max-width:100px">
                                    <span class="input-group-text text-muted">giờ</span>
                                    <input type="number" class="form-control" id="offerMinutes"
                                           placeholder="Phút" min="0" max="59" style="max-width:100px">
                                    <span class="input-group-text text-muted">phút</span>
                                </div>
                                <input type="hidden" name="timeLeft" id="timeLeftHidden">
                                <small class="text-muted" th:if="${tour != null && tour.get('timeLeft') != null}">
                                    Hết hạn lúc: <span id="currentExpiry"
                                                       th:text="${tour.get('timeLeft')}"></span>
                                </small>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section-title"><i class="bi bi-geo-alt-fill me-2"></i> Hình ảnh & Vị trí</div>
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Ảnh đại diện Tour (Mặc định)</label>
                        <input type="file" class="form-control mb-2" name="mainImageFile" onchange="previewMain(this)">
                        <input type="hidden" name="anhDaiDien" th:value="${tour != null ? tour.get('imageUrl') : ''}">
                        <div id="mainPreview">
                            <img th:if="${tour != null && tour.get('imageUrl') != null && tour.get('imageUrl') != ''}" th:src="${tour.get('imageUrl')}" class="preview-img">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Địa điểm tham quan</label>
                        <input type="text" class="form-control" name="vitri" th:value="${tour != null ? tour.get('location') : ''}" required>
                    </div>
                </div>

                <div class="section-title"><i class="bi bi-cash-stack me-2"></i> Giá bán thực tế (Sau khi giảm)</div>
                <div class="row mb-4">
                    <div class="col-md-4">
                        <label class="form-label">Giá Người lớn</label>
                        <input type="number" class="form-control" id="priceNL" name="giaNguoiLon" th:value="${tour != null ? tour.get('price') : 0}" required oninput="handlePriceInput()">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Giá Trẻ em</label>
                        <input type="number" class="form-control" id="priceTE" name="giaTreEm" th:value="${tour != null ? tour.get('giaTreEm') : 0}" oninput="handlePriceInput()">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Giá Trẻ nhỏ</label>
                        <input type="number" class="form-control" id="priceTN" name="giaTreNho" th:value="${tour != null ? tour.get('giaTreNho') : 0}" oninput="handlePriceInput()">
                    </div>
                </div>

                <div class="section-title"><i class="bi bi-calendar-event me-2"></i> Loại Tour & Thời gian</div>
                <div class="row mb-4">
                    <div class="col-md-4">
                        <label class="form-label">Loại Tour</label>
                        <select name="loaiTour" class="form-select">
                            <option value="1" th:selected="${tour != null && tour.get('type') == 'DAY_TOUR'}">Trong ngày</option>
                            <option value="2" th:selected="${tour != null && tour.get('type') == 'MULTI_DAY'}">Nhiều ngày</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Số ngày</label>
                        <input type="number" class="form-control" name="soNgay" th:value="${tour != null ? (tour.get('duration') != null ? tour.get('duration').split(' ')[0] : 1) : 1}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Điểm khởi hành</label>
                        <input type="text" class="form-control" name="diemKhoiHanh" th:value="${tour != null ? tour.get('diemKhoiHanh') : ''}">
                    </div>
                </div>

                <div class="section-title"><i class="bi bi-people-fill me-2"></i> Quy mô & Khách hàng</div>
                <div class="row mb-4">
                    <div class="col-md-4">
                        <label class="form-label">Quy mô Tour</label>
                        <select name="tourScale" class="form-select">
                            <option value="small" th:selected="${tour != null && tour.get('scale') == 'small'}">Nhỏ</option>
                            <option value="medium" th:selected="${tour != null && tour.get('scale') == 'medium'}">Vừa</option>
                            <option value="large" th:selected="${tour != null && tour.get('scale') == 'large'}">Lớn</option>
                            <option value="custom" th:selected="${tour != null && tour.get('scale') == 'custom'}">Tùy chỉnh</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Số khách tối thiểu</label>
                        <input type="number" class="form-control" name="minGuests" th:value="${tour != null ? tour.get('minGuests') : 1}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Số khách tối đa</label>
                        <input type="number" class="form-control" name="maxGuests" th:value="${tour != null ? tour.get('maxGuests') : 50}">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Ngày khởi hành</label>
                    <div class="d-flex gap-2 mb-2">
                        <input type="date" class="form-control" id="datePicker" style="max-width:200px;background:#162d55">
                        <button type="button" class="btn btn-primary" onclick="addDate()">
                            <i class="bi bi-plus-circle me-1"></i> Thêm ngày
                        </button>
                    </div>
                    <div id="tagsWrap" class="d-flex flex-wrap gap-2 p-2"
                         style="min-height:42px; border:1px dashed #334155; border-radius:8px; background:#0f172a;">
                        <span id="emptyHint" class="text-muted small align-self-center">Chưa có ngày nào</span>
                    </div>
                    <input type="hidden" id="ngayKhoiHanh" name="ngayKhoiHanh"
                           th:value="${tour != null ? tour.get('startDate') : ''}">
                </div>

                <div class="section-title"><i class="bi bi-card-text me-2"></i> Nội dung chi tiết</div>
                <div class="mb-4">
                    <label class="form-label">Dịch vụ</label>
                    <textarea class="form-control mb-3" name="dichVu" rows="3" th:text="${tour != null ? tour.get('dichVu') : ''}"></textarea>

                    <label class="form-label">Lộ trình</label>
                    <textarea class="form-control mb-3" name="loTrinh" rows="3" th:text="${tour != null ? tour.get('loTrinh') : ''}"></textarea>

                    <label class="form-label">Trải nghiệm</label>
                    <textarea class="form-control" name="traiNghiem" rows="3" th:text="${tour != null ? tour.get('traiNghiem') : ''}"></textarea>
                </div>

                <div class="d-flex justify-content-end gap-3 mt-4">
                    <a href="/admin/tours" class="btn btn-secondary px-4">Hủy</a>
                    <button type="submit" class="btn btn-primary px-5">Lưu Tour</button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="none">
        function toggleOffer() {
            const isChecked = document.getElementById('isOffer').checked;
            document.getElementById('offerSection').style.display = isChecked ? 'block' : 'none';
            if (isChecked) {
                syncToOriginal(true);
                autoCalculate();
            }
        }

        document.getElementById('tourForm').addEventListener('submit', function() {
            const hours   = parseInt(document.getElementById('offerHours').value)   || 0;
            const minutes = parseInt(document.getElementById('offerMinutes').value) || 0;
            const isOffer = document.getElementById('isOffer').checked;
            if (isOffer && (hours > 0 || minutes > 0)) {
                const expiry = Date.now() + (hours * 60 + minutes) * 60 * 1000;
                document.getElementById('timeLeftHidden').value = String(expiry);
            } else if (!isOffer) {
                document.getElementById('timeLeftHidden').value = '0';
            }
        });

        function autoCalculate() {
            const pct = parseFloat(document.getElementById('discountPercent').value) || 0;
            const factor = (100 - pct) / 100;
            const fields = [['origNL','priceNL'],['origTE','priceTE'],['origTN','priceTN']];
            fields.forEach(([origId, priceId]) => {
                const origEl  = document.getElementById(origId);
                const priceEl = document.getElementById(priceId);
                const origVal = parseFloat(origEl.value) || 0;
                if (origVal > 0) priceEl.value = Math.round(origVal * factor);
            });
            document.getElementById('discountTag').value = pct > 0 ? '-' + pct + '%' : '';
        }

        function handlePriceInput() {
            const isOffer = document.getElementById('isOffer').checked;
            if (!isOffer) {
                syncToOriginal(true);
            } else {
                calculatePercentFromPrices();
            }
        }

        function calculatePercentFromPrices() {
            const origNL  = parseFloat(document.getElementById('origNL').value)  || 0;
            const priceNL = parseFloat(document.getElementById('priceNL').value) || 0;
            if (origNL > priceNL && origNL > 0) {
                const pct = Math.round((1 - (priceNL / origNL)) * 100);
                document.getElementById('discountPercent').value = pct;
                document.getElementById('discountTag').value = '-' + pct + '%';
            }
        }

        function syncToOriginal(force = false) {
            const fields = [['origNL','priceNL'],['origTE','priceTE'],['origTN','priceTN']];
            fields.forEach(([origId, priceId]) => {
                const origEl  = document.getElementById(origId);
                const priceEl = document.getElementById(priceId);
                if (force || !origEl.value || origEl.value === '0') {
                    origEl.value = priceEl.value;
                }
            });
        }

        function previewMain(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('mainPreview').innerHTML =
                        `<img src="${e.target.result}" class="preview-img">`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function previewOffer(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('offerPreview').innerHTML =
                        `<img src="${e.target.result}" class="preview-img">`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        /* ── Date tags ── */
        let dates = [];

        function addDate() {
            const input = document.getElementById('datePicker');
            const val   = input.value;               // "YYYY-MM-DD"
            if (!val || dates.find(d => d.val === val)) { input.value = ''; return; }

            // Tách thủ công để tránh lệch timezone
            const [y, m, day] = val.split('-');
            const label = `${day}/${m}/${y}`;
            dates.push({ val, label });
            renderTags();
            input.value = '';
        }

        function removeDate(val) {
            dates = dates.filter(d => d.val !== val);
            renderTags();
        }

        function renderTags() {
            const wrap   = document.getElementById('tagsWrap');
            const hidden = document.getElementById('ngayKhoiHanh');
            if (!dates.length) {
                wrap.innerHTML =
                    '<span id="emptyHint" class="text-muted small align-self-center">Chưa có ngày nào</span>';
                hidden.value = '';
                return;
            }
            const sorted = [...dates].sort((a, b) => a.val.localeCompare(b.val));
            wrap.innerHTML = sorted.map(d => `
                <span class="badge d-inline-flex align-items-center gap-1"
                      style="background:rgba(59,130,246,0.15);color:#93c5fd;border:1px solid #1d4ed8;
                             font-size:13px;padding:6px 10px;border-radius:6px">
                    <i class="bi bi-calendar3"></i> ${d.label}
                    <button type="button" onclick="removeDate('${d.val}')"
                            style="background:none;border:none;color:inherit;cursor:pointer;
                                   padding:0;margin-left:4px;font-size:15px;line-height:1">&times;</button>
                </span>
            `).join('');
            hidden.value = sorted.map(d => d.label).join(', ');
        }

        /* ── Khởi tạo một lần duy nhất ── */
        window.addEventListener('DOMContentLoaded', () => {

            // 1. Parse ngày cũ thành tags
            const existing = document.getElementById('ngayKhoiHanh').value;
            if (existing) {
                existing.split(',').map(s => s.trim()).filter(Boolean).forEach(label => {
                    const parts = label.split('/');
                    if (parts.length === 3) {
                        const val = `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
                        if (!dates.find(d => d.val === val)) dates.push({ val, label });
                    }
                });
                renderTags();
            }

            // 2. Khởi tạo offer section
            const isChecked = document.getElementById('isOffer').checked;
            if (isChecked) {
                document.getElementById('offerSection').style.display = 'block';
                const origNL = parseFloat(document.getElementById('origNL').value) || 0;
                if (origNL === 0) syncToOriginal(true);
                autoCalculate();
            }
        });
    </script>
</body>
</html>

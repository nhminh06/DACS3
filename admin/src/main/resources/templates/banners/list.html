<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý Banner - WIND Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
    <style>
        :root {
            --bg-deep:    #080e1a;
            --bg-base:    #0d1526;
            --bg-card:    #111d30;
            --bg-hover:   #162035;
            --bg-input:   #0a1221;
            --border:     #1e2f4a;
            --border-hi:  #2a4170;
            --accent:     #3d7fff;
            --accent-dim: #1a3a70;
            --gold:       #f0a500;
            --gold-dim:   #3d2a00;
            --text-1:     #e8eef8;
            --text-2:     #7a90b0;
            --text-3:     #3d5070;
            --success:    #10b981;
            --danger:     #ef4444;
            --danger-dim: #3a1010;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-1);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
        }

        /* ── Page header ─────────────────────────────── */
        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 0 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 28px;
        }
        .page-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-1);
            letter-spacing: -.3px;
            margin: 0 0 4px;
        }
        .page-sub {
            font-size: 13px;
            color: var(--text-2);
            margin: 0;
        }
        .btn-add {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 9px 18px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background .15s, transform .1s;
        }
        .btn-add:hover  { background: #5590ff; }
        .btn-add:active { transform: scale(.97); }

        /* ── Form panel ──────────────────────────────── */
        .form-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 32px;
            display: none;
            animation: slideDown .2s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .form-panel-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            align-items: start;
        }

        /* Drop zone */
        .drop-zone {
            width: 100%;
            aspect-ratio: 16/6;
            background: var(--bg-input);
            border: 1.5px dashed var(--border-hi);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: border-color .2s, background .2s;
            overflow: hidden;
            position: relative;
        }
        .drop-zone:hover {
            border-color: var(--accent);
            background: #0d1c35;
        }
        .drop-zone img {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
        .drop-zone-icon {
            width: 44px; height: 44px;
            background: var(--bg-hover);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            color: var(--text-3);
        }
        .drop-zone-text  { font-size: 13px; color: var(--text-2); }
        .drop-zone-hint  { font-size: 11px; color: var(--text-3); font-family: 'DM Mono', monospace; }

        /* Side controls */
        .form-side { display: flex; flex-direction: column; gap: 16px; }
        .field-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: .7px;
            margin-bottom: 6px;
        }
        .field-hint { font-size: 11px; color: var(--text-3); margin-top: 5px; }

        .order-input-wrap {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .order-input-wrap:focus-within { border-color: var(--accent); }
        .order-stepper {
            display: flex;
            flex-direction: column;
        }
        .order-stepper button {
            width: 32px; height: 22px;
            background: var(--bg-hover);
            border: none;
            border-left: 1px solid var(--border);
            color: var(--text-2);
            font-size: 10px;
            cursor: pointer;
            transition: background .1s, color .1s;
        }
        .order-stepper button:hover { background: var(--border); color: var(--text-1); }
        .order-input-wrap input[type=number] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-1);
            font-family: 'DM Mono', monospace;
            font-size: 20px;
            font-weight: 500;
            padding: 10px 14px;
            outline: none;
            width: 0;
            -moz-appearance: textfield;
        }
        .order-input-wrap input[type=number]::-webkit-inner-spin-button,
        .order-input-wrap input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

        .priority-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .priority-chip {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-family: 'DM Mono', monospace;
            border: 1px solid var(--border);
            color: var(--text-2);
            background: transparent;
            cursor: pointer;
            transition: .15s;
        }
        .priority-chip:hover,
        .priority-chip.active {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent);
        }

        .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .btn-cancel {
            flex: 1;
            padding: 9px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text-2);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: .15s;
        }
        .btn-cancel:hover { background: var(--bg-hover); color: var(--text-1); }
        .btn-save {
            flex: 2;
            padding: 9px;
            background: var(--accent);
            border: none;
            border-radius: 9px;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background .15s;
        }
        .btn-save:hover { background: #5590ff; }

        /* ── Section label ───────────────────────────── */
        .section-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .section-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .banner-count {
            font-size: 11px;
            font-family: 'DM Mono', monospace;
            color: var(--text-3);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 3px 9px;
            border-radius: 20px;
        }

        /* ── Banner grid ─────────────────────────────── */
        .banner-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .banner-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            transition: border-color .2s, transform .2s;
        }
        .banner-card:hover {
            border-color: var(--border-hi);
            transform: translateY(-3px);
        }

        .banner-img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16/7;
            overflow: hidden;
            background: var(--bg-input);
        }
        .banner-img-wrap img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .3s;
        }
        .banner-card:hover .banner-img-wrap img { transform: scale(1.03); }

        /* order badge */
        .order-badge {
            position: absolute;
            top: 10px; left: 10px;
            min-width: 28px; height: 28px;
            padding: 0 7px;
            border-radius: 8px;
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            display: flex; align-items: center; justify-content: center;
            z-index: 3;
            backdrop-filter: blur(4px);
        }
        .order-badge-1 { background: rgba(240,165,0,.18); color: #f0a500; border: 1px solid rgba(240,165,0,.35); }
        .order-badge-2 { background: rgba(61,127,255,.18); color: #7aaeff; border: 1px solid rgba(61,127,255,.35); }
        .order-badge-3 { background: rgba(16,185,129,.18); color: #10b981; border: 1px solid rgba(16,185,129,.35); }
        .order-badge-n { background: rgba(30,47,74,.7);    color: var(--text-2); border: 1px solid var(--border); }

        /* hover action overlay */
        .banner-overlay {
            position: absolute;
            inset: 0;
            background: rgba(8,14,26,.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0;
            transition: opacity .2s;
        }
        .banner-card:hover .banner-overlay { opacity: 1; }
        .overlay-btn {
            width: 36px; height: 36px;
            border-radius: 9px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.08);
            color: #fff;
            font-size: 15px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background .15s, border-color .15s;
            text-decoration: none;
        }
        .overlay-btn:hover { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.3); color: #fff; }
        .overlay-btn-danger:hover { background: rgba(239,68,68,.25); border-color: rgba(239,68,68,.4); }

        /* card footer */
        .banner-footer {
            padding: 11px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border);
        }
        .banner-meta { display: flex; align-items: center; gap: 8px; }
        .banner-order-label { font-size: 11px; color: var(--text-3); }
        .banner-order-val {
            font-size: 13px;
            font-weight: 500;
            font-family: 'DM Mono', monospace;
            color: var(--text-1);
        }
        .banner-status {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            font-family: 'DM Mono', monospace;
        }
        .status-active   { background: rgba(16,185,129,.12); color: #10b981; border: 1px solid rgba(16,185,129,.25); }
        .status-inactive { background: rgba(100,116,139,.1);  color: var(--text-2); border: 1px solid var(--border); }

        /* ── Empty state ─────────────────────────────── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-3);
        }
        .empty-state i { font-size: 40px; margin-bottom: 12px; display: block; }
        .empty-state p { font-size: 13px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar('banners')}"></div>

<div class="main">

    <!-- Page header -->
    <div class="page-header">
        <div>
            <h1 class="page-title">Quản lý Banner</h1>
            <p class="page-sub">Số thứ tự nhỏ hơn = hiển thị ưu tiên hơn trên trang chủ</p>
        </div>
        <button class="btn-add" onclick="showAddForm()">
            <i class="bi bi-plus-lg"></i> Thêm banner
        </button>
    </div>

    <!-- Form panel -->
    <div id="bannerFormContainer" class="form-panel">
        <div class="form-panel-title" id="formPanelTitle">Thêm banner mới</div>
        <form th:action="@{/admin/banners/save}" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="id" id="bannerId">
            <input type="hidden" name="imageUrl" id="bannerUrl">

            <div class="form-row">
                <!-- Drop zone -->
                <div>
                    <div class="field-label">Ảnh banner</div>
                    <div class="drop-zone" id="previewContainer"
                         onclick="document.getElementById('imageFileInput').click()">
                        <div class="drop-zone-icon"><i class="bi bi-cloud-arrow-up"></i></div>
                        <span class="drop-zone-text">Nhấn để chọn ảnh</span>
                        <span class="drop-zone-hint">JPG, PNG, WEBP · Tỉ lệ 16:6 khuyến nghị</span>
                    </div>
                    <input type="file" id="imageFileInput" class="d-none"
                           name="imageFile" accept="image/*" onchange="previewImage(this)">
                </div>

                <!-- Side controls -->
                <div class="form-side">
                    <div>
                        <div class="field-label">Thứ tự ưu tiên</div>
                        <div class="order-input-wrap">
                            <input type="number" name="order" id="bannerOrder"
                                   min="1" max="99" value="1">
                            <div class="order-stepper">
                                <button type="button"
                                        onclick="stepOrder(1)">&#9650;</button>
                                <button type="button"
                                        onclick="stepOrder(-1)">&#9660;</button>
                            </div>
                        </div>
                        <div class="field-hint">Chọn nhanh:</div>
                        <div class="priority-chips mt-1" id="priorityChips">
                            <button type="button" class="priority-chip active"
                                    onclick="setOrder(1)">1</button>
                            <button type="button" class="priority-chip"
                                    onclick="setOrder(2)">2</button>
                            <button type="button" class="priority-chip"
                                    onclick="setOrder(3)">3</button>
                            <button type="button" class="priority-chip"
                                    onclick="setOrder(4)">4</button>
                            <button type="button" class="priority-chip"
                                    onclick="setOrder(5)">5</button>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-cancel"
                                onclick="hideForm()">Hủy</button>
                        <button type="submit" class="btn-save">
                            <i class="bi bi-check2 me-1"></i>Lưu banner
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- Banner list -->
    <div class="section-bar">
        <span class="section-label">Danh sách banner</span>
        <span class="banner-count" th:text="${banners.size()} + ' banner'">0 banner</span>
    </div>

    <div class="banner-grid">
        <div th:each="banner, iterStat : ${banners}" class="banner-card">
            <div class="banner-img-wrap">
                <img th:src="${banner.imageUrl}" alt="banner">

                <!-- order badge: gold=1, blue=2, green=3, gray=rest -->
                <div th:class="${banner.order == 1 ? 'order-badge order-badge-1' :
                                    banner.order == 2 ? 'order-badge order-badge-2' :
                                    banner.order == 3 ? 'order-badge order-badge-3' :
                                                        'order-badge order-badge-n'}"
                     th:text="'#' + ${banner.order}"></div>

                <!-- hover overlay -->
                <div class="banner-overlay">
                    <button class="overlay-btn"
                            th:onclick="editBanner([[${banner}]])"
                            title="Chỉnh sửa">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <a th:href="@{/admin/banners/delete/{id}(id=${banner.id})}"
                       class="overlay-btn overlay-btn-danger"
                       onclick="return confirm('Xóa banner này?')"
                       title="Xóa">
                        <i class="bi bi-trash"></i>
                    </a>
                </div>
            </div>

            <div class="banner-footer">
                <div class="banner-meta">
                    <span class="banner-order-label">Ưu tiên</span>
                    <span class="banner-order-val" th:text="'#' + ${banner.order}"></span>
                </div>
                <span th:class="${banner.status == 'active' ? 'banner-status status-active' : 'banner-status status-inactive'}"
                      th:text="${banner.status == 'active' ? 'Hiển thị' : 'Đã ẩn'}"></span>
            </div>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(banners)}" class="empty-state">
            <i class="bi bi-image"></i>
            <p>Chưa có banner nào. Nhấn <strong>Thêm banner</strong> để bắt đầu.</p>
        </div>
    </div>
</div>

<script>
    function showAddForm() {
        document.getElementById('bannerId').value = '';
        document.getElementById('bannerOrder').value = 1;
        document.getElementById('bannerUrl').value = '';
        document.getElementById('previewContainer').innerHTML =
            '<div class="drop-zone-icon"><i class="bi bi-cloud-arrow-up"></i></div>' +
            '<span class="drop-zone-text">Nhấn để chọn ảnh</span>' +
            '<span class="drop-zone-hint">JPG, PNG, WEBP · Tỉ lệ 16:6 khuyến nghị</span>';
        document.getElementById('formPanelTitle').textContent = 'Thêm banner mới';
        syncChips(1);
        document.getElementById('bannerFormContainer').style.display = 'block';
        document.getElementById('bannerFormContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function hideForm() {
        document.getElementById('bannerFormContainer').style.display = 'none';
    }

    function editBanner(banner) {
        document.getElementById('bannerId').value = banner.id;
        document.getElementById('bannerOrder').value = banner.order ?? 1;
        document.getElementById('bannerUrl').value = banner.imageUrl;
        document.getElementById('previewContainer').innerHTML =
            `<img src="${banner.imageUrl}" alt="preview">`;
        document.getElementById('formPanelTitle').textContent = 'Chỉnh sửa banner';
        syncChips(banner.order ?? 1);
        document.getElementById('bannerFormContainer').style.display = 'block';
        document.getElementById('bannerFormContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('previewContainer').innerHTML =
                    `<img src="${e.target.result}" alt="preview">`;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function stepOrder(delta) {
        const inp = document.getElementById('bannerOrder');
        const val = Math.max(1, Math.min(99, (parseInt(inp.value) || 1) + delta));
        inp.value = val;
        syncChips(val);
    }

    function setOrder(val) {
        document.getElementById('bannerOrder').value = val;
        syncChips(val);
    }

    function syncChips(val) {
        document.querySelectorAll('.priority-chip').forEach(c => {
            c.classList.toggle('active', parseInt(c.textContent) === parseInt(val));
        });
    }

    document.getElementById('bannerOrder').addEventListener('input', function () {
        syncChips(parseInt(this.value) || 1);
    });
</script>
</body>
</html>
